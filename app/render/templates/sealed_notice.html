<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<style>
  @font-face { font-family: "Gelasio"; src: url("fonts/Gelasio.ttf"); font-weight: 400 700; }
  @font-face { font-family: "Noto Sans"; src: url("fonts/NotoSans.ttf"); font-weight: 100 900; }
  @font-face { font-family: "JetBrains Mono"; src: url("fonts/JetBrainsMono.ttf"); font-weight: 100 800; }
  @page { size: A4; margin: 0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #FFFFFF; color: #1A1D1B; font-family: "Noto Sans", sans-serif; }
  .sheet { width: 794px; min-height: 1123px; padding: 64px 72px 40px; position: relative; display: flex; flex-direction: column; }
  .head { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 3px solid #33504A; padding-bottom: 14px; }
  .brand { font-family: "Gelasio", serif; font-weight: 700; font-size: 34px; color: #33504A; letter-spacing: .5px; }
  .brand .mark { display: inline-block; width: 30px; height: 30px; border-radius: 50%; background: #33504A; margin-right: 10px; vertical-align: -4px;
                 box-shadow: inset 0 0 0 5px #fff, inset 0 0 0 7px #B5763A; }
  .label { font-size: 10.5px; letter-spacing: 1.6px; text-transform: uppercase; color: #B5763A; font-weight: 600; text-align: right; max-width: 300px; }
  h1 { font-family: "Gelasio", serif; font-size: 26px; margin: 40px 0 6px; line-height: 1.25; }
  .ref { font-family: "JetBrains Mono", monospace; font-size: 12.5px; color: #595C55; margin-bottom: 26px; }
  p { font-size: 15.5px; line-height: 1.65; margin: 0 0 14px; }
  .sign { margin-top: 26px; font-weight: 600; }
  .spacer { flex: 1; }
  .seal { display: grid; grid-template-columns: 112px 1fr; gap: 18px; align-items: center; border: 1.5px solid #33504A; border-radius: 10px;
          padding: 14px 18px; margin-top: 36px; background: #F7F4EC; }
  .seal img { width: 112px; height: 112px; }
  .seal .t { font-family: "Gelasio", serif; font-weight: 700; font-size: 17px; color: #33504A; }
  .seal .c { font-family: "JetBrains Mono", monospace; font-size: 14px; letter-spacing: 2px; color: #A8322D; margin: 4px 0; }
  .seal .u { font-family: "JetBrains Mono", monospace; font-size: 11px; color: #595C55; word-break: break-all; }
  .seal .s { font-size: 12px; color: #595C55; margin-top: 4px; }
</style></head>
<body><div class="sheet">
  <div class="head">
    <div class="brand"><span class="mark"></span>{{ issuer.name }}</div>
    <div class="label">{{ issuer.label }}</div>
  </div>
  <h1>{{ layout.title }}</h1>
  <div class="ref">Ref {{ layout.ref }} · {{ layout.date }}</div>
  {% for p in paragraphs %}<p>{{ p }}</p>{% endfor %}
  <p class="sign">{{ layout.signoff }}</p>
  <div class="spacer"></div>
  <div class="seal">
    <img src="{{ qr }}" alt="Pramaan Seal QR code">
    <div>
      <div class="t">Pramaan Seal</div>
      <div class="c">{{ code }}</div>
      <div class="s">Scan the QR to verify this notice: it opens the exact text {{ issuer.name }} signed.</div>
      <div class="u">{{ url }}</div>
    </div>
  </div>
</div></body></html>
