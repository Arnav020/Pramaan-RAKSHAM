# PUBLIC split: messages from the real world.
# Collected 24 Oct 2026 from news reports, fact checks and official advisories, BEFORE any further rule change,
# and frozen in eval/PUBLIC_FROZEN.sha256. Never used for tuning.
#
# fidelity:
#   verbatim         the message exactly as printed by the source
#   excerpt+described the source's quoted opening plus its description of the rest
#   victim_account   how a victim recounted the call (what a person types in "During a call" mode)
#   described        the source's description of the message, written as the message
# Phone numbers stay masked as in the sources. Short quotes only, each with its source.

items:
  - {id: p01, split: public, label: scam, lang: en, cat: reward_apk, fidelity: verbatim, date: "2025-12-27", source: "https://www.latestly.com/social-viral/fact-check/did-you-receive-an-sms-or-whatsapp-message-asking-you-to-download-an-app-to-redeem-sbi-reward-points-pib-fact-check-debunks-fake-message-going-viral-7253978.html", text: "Dear Valued Customer, Your SBI NetBanking reward points (Rs 9,980) will expire today! Now redeem through SBI Reward App. Install & claim your reward by cash deposit in your account. SBI REWARD27.apk"}
  - {id: p02, split: public, label: scam, lang: en, cat: kyc_phishing, fidelity: verbatim, date: "2022-08-30", source: "https://www.businesstoday.in/technology/story/message-from-sbi-to-update-your-pan-card-details-is-a-scam-do-not-fall-for-it-345946-2022-08-30", text: "Dear Customer, your SBI YONO Account is Closed Today Contact now And Update your PAN NUMBER in the following link"}
  - {id: p03, split: public, label: scam, lang: en, cat: reward_link, fidelity: verbatim, date: "2024-11-10", source: "https://www.thetechoutlook.com/news/security/fraudsters-target-sbi-customers-with-fake-yono-rewards-message/", text: "Hi User Your -S.B.I YONO MC R’ewards Point E’xpire Rs.7854 today P’lease C’onvert to cash click link https://bitly.ws/3e5Cd"}
  - {id: p04, split: public, label: scam, lang: en, cat: tax_refund, fidelity: verbatim, date: "2023-08-03", source: "https://www.businesstoday.in/personal-finance/tax/story/itr-refund-status-centre-issues-scam-alert-on-fraudulent-messages-392717-2023-08-03", text: "You have been approved a tax refund of Rs 15,490 and the amount will be credited to your account number 5xxxxx6755. If this is not correct please update your bank account information by visiting the link below."}
  - {id: p05, split: public, label: scam, lang: en, cat: kyc_phishing, fidelity: verbatim, date: "2023-03-09", source: "https://english.factcrescendo.com/?p=15481", text: "Dear HDFC Customer Your HDFC Account/Netbanking will be block today. Please update you pan card and complete your KYC now. click here"}
  - {id: p06, split: public, label: scam, lang: en, cat: utility_bill, fidelity: excerpt+described, date: "2022-06-23", source: "https://sentinelassam.com/topheadlines/beware-of-fake-sms-on-power-bills-598773", text: "Dear Consumer, Your Electricity power will be disconnected tomorrow at 9:30 pm because your last month bill was not updated. Please immediately contact our electricity officer on his mobile number."}
  - {id: p07, split: public, label: scam, lang: en, cat: digital_arrest, fidelity: victim_account, date: "2024-11-07", source: "https://www.tribuneindia.com/news/chandigarh/73-year-old-put-under-digital-arrest-duped-of-16-lakh", text: "He told me that a parcel sent in my name to Iran had been seized by surveillance agencies. They said there is a money laundering case, I must remain in my house and not disclose this to anyone as I am under digital arrest, and transfer my money to a savings account of the RBI which will be returned in two days."}
  - {id: p08, split: public, label: scam, lang: en, cat: digital_arrest, fidelity: victim_account, date: "2024-12-01", source: "https://www.deccanherald.com/india/uttarakhand/woman-put-under-digital-arrest-in-dehradun-duped-of-rs-17-crore-3315601", text: "I received a call from FedEx Courier saying I had sent a consignment from Mumbai to Taiwan with MDMA and fake documents. Then a Mumbai crime branch officer on video told me to keep the doors closed, not talk to anyone, and transfer money for verification."}
  - {id: p09, split: public, label: scam, lang: en, cat: digital_arrest, fidelity: described, date: "2024-05-20", source: "https://www.thenewsminute.com/karnataka/fedex-scam-bengaluru-software-engineer-loses-rs-1-crore-to-fraudsters", text: "Skype call from a FedEx logistics executive: 200 grams of narcotic drugs and several passports were found in a parcel listing your name and number at the Mumbai airport. A police officer will now question you on camera."}
  - {id: p10, split: public, label: scam, lang: en, cat: investment_tips, fidelity: described, date: "2014-12-08", source: "https://www.business-standard.com/article/pti-stories/sebi-exchanges-tighten-noose-on-sms-tipsters-114120800514_1.html", text: "Get our premium trading tips by SMS and WhatsApp. 200% assured returns on a deposit payment of Rs 25,000."}
  - {id: p11, split: public, label: scam, lang: en, cat: loan_fee, fidelity: described, date: "2025-06-01", source: "https://www.indusind.bank.in/iblogs/?p=14978", text: "Congratulations, you have been pre-approved for a personal loan. No income proof required, no credit check. Pay a small verification and processing fee to release the loan today."}
  - {id: p12, split: public, label: scam, lang: en, cat: lottery, fidelity: described, date: "2022-11-01", source: "https://eastmojo.com/fact-check/2022/11/01/fact-check-kbc-lottery-with-rs-25-lakh-reward-on-whatsapp-is-fake/", text: "Congratulations! Your WhatsApp number has won Rs 25 lakh in the KBC lottery. To claim the prize contact our manager on WhatsApp and deposit the processing charges first."}
  - {id: p13, split: public, label: scam, lang: en, cat: telecom_threat, fidelity: described, date: "2024-06-14", source: "https://www.voicendata.com/news/trai-warns-against-fake-calls-threatening-mobile-disconnection-8937750", text: "This call is from TRAI. Your mobile number will be blocked soon because of illegal activity. Share your Aadhaar details and join a Skype video call with the police to avoid disconnection."}
  - {id: p14, split: public, label: scam, lang: en, cat: parcel_address, fidelity: described, date: "2024-04-10", source: "https://cyberpeace.org/resources/blogs/factcheck-beware-fake-india-post-delivery-scam-alert", text: "India Post: your package has arrived at the warehouse but could not be delivered due to incomplete address information. Update your address within 12 hours or it will be returned: http://iydc.in/u/5c0c5939f"}
  - {id: p15, split: public, label: scam, lang: en, cat: task_job, fidelity: described, date: "2023-05-06", source: "https://newschecker.in/scam-watch/fraud-terror-and-trail-of-death-the-telegram-task-scam-spreading-fast-in-india", text: "Part-time work from home: earn Rs 150 to 250 for every YouTube video you like. Join our Telegram group for daily tasks, then invest in prepaid tasks for higher commission."}
  - {id: p16, split: public, label: scam, lang: en, cat: loan_fee, fidelity: described, date: "2026-09-03", source: "https://www.outlookmoney.com/news/fake-whatsapp-messages-claiming-mudra-loan-approval-are-scams-pib-fact-check-issues-advisory", text: "Your MUDRA loan application has been approved. Click the link and share your bank account details to receive the loan amount."}
  - {id: q01, split: public, label: genuine, kind: official, lang: en, cat: bank_advisory, fidelity: verbatim, date: "2021-04-05", source: "https://money9.com/news/banking/sbi-cautions-customers-against-online-fd-fraud-advises-not-to-share-bank-details-22446.html", text: "Don't fall for scammers impersonating as SBI, we never ask for personal details like Password/OTP/CVV/Card Number over the phone."}
  - {id: q02, split: public, label: genuine, kind: official, lang: en, cat: bank_advisory, fidelity: described, date: "2023-03-09", source: "https://english.factcrescendo.com/?p=15481", text: "HDFC Bank sends messages only from its official IDs and will never ask for PAN details, OTP, UPI PIN, MPIN, Customer ID and password, card number, ATM PIN or CVV."}
  - {id: q03, split: public, label: genuine, kind: official, lang: en, cat: govt_advisory, fidelity: described, date: "2025-12-27", source: "https://www.latestly.com/social-viral/fact-check/did-you-receive-an-sms-or-whatsapp-message-asking-you-to-download-an-app-to-redeem-sbi-reward-points-pib-fact-check-debunks-fake-message-going-viral-7253978.html", text: "PIB Fact Check: SBI never sends links or APK files over SMS or WhatsApp to redeem reward points. Do not download such files or click such links."}
  - {id: q04, split: public, label: genuine, kind: official, lang: en, cat: govt_advisory, fidelity: described, date: "2024-06-14", source: "https://www.voicendata.com/news/trai-warns-against-fake-calls-threatening-mobile-disconnection-8937750", text: "TRAI does not initiate any communication about disconnecting mobile numbers through messages or calls. Report suspected fraud communication on Chakshu at sancharsaathi.gov.in, and call 1930 if you lost money."}
  - {id: q05, split: public, label: genuine, kind: official, lang: en, cat: govt_advisory, fidelity: described, date: "2023-08-03", source: "https://www.businesstoday.in/personal-finance/tax/story/itr-refund-status-centre-issues-scam-alert-on-fraudulent-messages-392717-2023-08-03", text: "The Income Tax Department does not send refund links by SMS or email and never asks for your PIN or password. Refunds are issued only after your return is processed."}
  - {id: q06, split: public, label: genuine, kind: official, lang: en, cat: utility_advisory, fidelity: described, date: "2022-06-23", source: "https://sentinelassam.com/topheadlines/beware-of-fake-sms-on-power-bills-598773", text: "Genuine messages from your electricity company come only from its registered sender ID and never ask you to call a personal mobile number. Do not call numbers in messages about disconnection."}
  - {id: q07, split: public, label: genuine, kind: official, lang: en, cat: govt_advisory, fidelity: described, date: "2026-01-20", source: "https://www.newsonair.gov.in/govt-debunks-sms-from-india-post-asking-people-to-update-their-address", text: "India Post never sends SMS asking customers to update address details through links. Treat any such message as a scam."}
  - {id: q08, split: public, label: genuine, kind: official, lang: en, cat: regulator_advisory, fidelity: described, date: "2025-01-01", source: "https://investor.sebi.gov.in/pdf/Pump%20and%20Dump%20Scam%20final.pdf", text: "Avoid anyone promising guaranteed high returns with little or no risk. Deal only with SEBI-registered intermediaries, and report fraud on the 1930 helpline."}
