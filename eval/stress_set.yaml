# STRESS split: "what would a judge type?" Written 24 Oct 2026 (night of the finale) to stress-test the live demo.
#
# This is a DEV set, not a measurement: we read every result and changed rules because of it. It must never be
# reported as accuracy. The frozen test, public and open-dataset results are the measurements.
#
# expect:  red      clearly a scam with two independent kinds of evidence: should be red
#          warn     clearly a scam: must at least be a "don't act" warning (red, or amber "high risk")
#          check    suspicious or unclear: "check first" is right; red would be too strong
#          not_red  genuine: anything except red (and ideally not a "don't act" warning)
#          clear    genuine and harmless: should be green or amber "no warning signs"
# All names, UPI IDs, phone numbers and domains are fictional (no real person's ID or number is used).
# Media items are generated by eval/generate/make_stress_media.py (synthetic voices, rendered screenshots).

items:
